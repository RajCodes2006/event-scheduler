name: event_scheduler
description: A clean personal event scheduler built with Flutter and SQLite.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  sqflite: ^2.4.4+2
  sqflite_common_ffi: ^2.4.4
  path: ^1.9.1
  path_provider: ^2.1.5
  table_calendar: ^3.3.0
  intl: ^0.20.3
  flutter_local_notifications: ^19.5.0
  flutter_timezone: ^5.1.1
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
