name: Build and publish Android + Windows downloads

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (use a new tag, e.g. v1.0.3)"
        required: true
        type: string
        default: "v1.0.4"

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test

      - name: Prepare persistent Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Missing Android signing secrets. Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD in GitHub repository secrets before publishing a release."
            exit 1
          fi
          KEYSTORE_FILE="$RUNNER_TEMP/daymark-upload-key.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          if [ ! -s "$KEYSTORE_FILE" ]; then
            echo "The decoded Android signing key is empty or invalid."
            exit 1
          fi
          {
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_FILE"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 3

  build-windows:
    name: Build Windows app
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop and generate runner files
        run: |
          flutter config --enable-windows-desktop
          flutter create --platforms=windows --project-name event_scheduler .

      - name: Apply Daymark Windows app icon
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --quiet Pillow
          python tools/create_windows_icon.py
          Copy-Item "build/branding/daymark_icon.ico" "windows/runner/resources/app_icon.ico" -Force

      - name: Install dependencies
        run: flutter pub get

      - name: Build release app
        run: flutter build windows --release

      - name: Package Windows app
        shell: pwsh
        run: |
          $releaseDir = "build/windows/x64/runner/Release"
          $exe = Join-Path $releaseDir "event_scheduler.exe"
          if (!(Test-Path $exe)) {
            Write-Error "Expected app executable not found: $exe"
            Get-ChildItem "build/windows" -Recurse -Filter "*.exe" | Select-Object -ExpandProperty FullName
            exit 1
          }
          Compress-Archive -Path (Join-Path $releaseDir "*") -DestinationPath "daymark-windows-x64.zip" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: daymark-windows-x64.zip
          if-no-files-found: error
          retention-days: 3

  publish-release:
    name: Publish Android and Windows downloads
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-assets

      - name: Download Windows ZIP
        uses: actions/download-artifact@v4
        with:
          name: windows-app
          path: release-assets

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: Daymark ${{ inputs.version }}
          body: |
            ## Daymark — Personal Event Scheduler

            ### Android
            Download `app-release.apk` and open it on your Android device. Android may ask you to allow installation from your browser or file manager.

            ### Windows
            Download and extract `daymark-windows-x64.zip`, then run `event_scheduler.exe`. Keep the extracted files together in the same folder.

            This is an early release. Only install software you trust.
          draft: false
          prerelease: false
          files: |
            release-assets/app-release.apk
            release-assets/daymark-windows-x64.zip
